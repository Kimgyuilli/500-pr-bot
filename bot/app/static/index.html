<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>500 Error Bot Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1117;
    color: #e1e4e8;
    min-height: 100vh;
    padding: 24px;
  }
  h1 { font-size: 1.5rem; margin-bottom: 24px; color: #fff; }
  h2 { font-size: 1.1rem; margin-bottom: 12px; color: #8b949e; font-weight: 500; }

  /* 플로우 시각화 */
  .pipeline {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 32px;
    overflow-x: auto;
    padding: 16px;
    background: #161b22;
    border-radius: 12px;
    border: 1px solid #30363d;
  }
  .step {
    flex: 1;
    min-width: 120px;
    padding: 16px 12px;
    border-radius: 8px;
    text-align: center;
    background: #21262d;
    border: 2px solid #30363d;
    transition: all 0.3s ease;
  }
  .step-name { font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
  .step-status { font-size: 0.75rem; color: #8b949e; }
  .step.active {
    border-color: #58a6ff;
    background: #1a2332;
    box-shadow: 0 0 16px rgba(88, 166, 255, 0.15);
  }
  .step.active .step-status { color: #58a6ff; }
  .step.done {
    border-color: #3fb950;
    background: #1a2e1f;
  }
  .step.done .step-status { color: #3fb950; }
  .step.failed {
    border-color: #f85149;
    background: #2d1b1b;
  }
  .step.failed .step-status { color: #f85149; }
  .arrow { color: #30363d; font-size: 1.2rem; flex-shrink: 0; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .step.active .step-status { animation: pulse 1.5s ease-in-out infinite; }

  /* 중단 영역 */
  .middle {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 24px;
    margin-bottom: 32px;
  }
  .test-section {
    display: flex;
    align-items: flex-start;
  }
  .test-btn {
    padding: 12px 24px;
    background: #238636;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s;
  }
  .test-btn:hover { background: #2ea043; }
  .test-btn:disabled { background: #21262d; cursor: not-allowed; color: #8b949e; }

  /* 히스토리 테이블 */
  .history {
    background: #161b22;
    border-radius: 12px;
    border: 1px solid #30363d;
    overflow: hidden;
  }
  .history table { width: 100%; border-collapse: collapse; }
  .history th {
    text-align: left;
    padding: 10px 14px;
    background: #21262d;
    font-size: 0.8rem;
    color: #8b949e;
    font-weight: 500;
  }
  .history td {
    padding: 10px 14px;
    font-size: 0.85rem;
    border-top: 1px solid #21262d;
  }
  .history tr:hover td { background: #1c2128; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .badge.done { background: #1a2e1f; color: #3fb950; }
  .badge.failed { background: #2d1b1b; color: #f85149; }
  .badge.active { background: #1a2332; color: #58a6ff; }
  .badge.pending { background: #21262d; color: #8b949e; }
  .history a { color: #58a6ff; text-decoration: none; }
  .history a:hover { text-decoration: underline; }
  .empty-msg { padding: 24px; text-align: center; color: #484f58; }

  /* 탭 */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    border-bottom: 1px solid #30363d;
  }
  .tab-btn {
    padding: 10px 20px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: #8b949e;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn:hover { color: #c9d1d9; }
  .tab-btn.active { color: #58a6ff; border-bottom-color: #58a6ff; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* 테스트 실행 결과 */
  .test-run-section {
    margin-bottom: 32px;
    background: #161b22;
    border-radius: 12px;
    border: 1px solid #30363d;
    padding: 16px;
  }
  .test-summary-bar {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
    font-size: 0.85rem;
  }
  .test-summary-bar .count {
    padding: 4px 12px;
    border-radius: 8px;
    font-weight: 600;
  }
  .count.total { background: #21262d; color: #c9d1d9; }
  .count.pass { background: #1a2e1f; color: #3fb950; }
  .count.fail { background: #2d1b1b; color: #f85149; }
  .test-log {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 12px;
    height: 200px;
    overflow-y: auto;
    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    font-size: 0.78rem;
    line-height: 1.5;
    color: #8b949e;
    margin-bottom: 12px;
  }
  .test-results-table { width: 100%; border-collapse: collapse; }
  .test-results-table th {
    text-align: left;
    padding: 8px 12px;
    background: #21262d;
    font-size: 0.8rem;
    color: #8b949e;
    font-weight: 500;
  }
  .test-results-table td {
    padding: 8px 12px;
    font-size: 0.82rem;
    border-top: 1px solid #21262d;
  }

  /* 실시간 로그 */
  .log-section { margin-top: 0; }
  .log {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 16px;
    height: 280px;
    overflow-y: auto;
    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    font-size: 0.8rem;
    line-height: 1.6;
  }
  .log-line { color: #8b949e; }
  .log-line .ts { color: #484f58; }
  .log-line .msg { color: #c9d1d9; }
  .log-line.step-received .msg { color: #58a6ff; }
  .log-line.step-done .msg { color: #3fb950; }
  .log-line.step-failed .msg { color: #f85149; }

  /* 연결 상태 */
  .conn-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    color: #8b949e;
    margin-left: 12px;
  }
  .conn-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #f85149;
  }
  .conn-dot.connected { background: #3fb950; }

  /* 히스토리 행 클릭 */
  .history tr[data-eid] { cursor: pointer; }

  /* 모달 */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    z-index: 1000;
    justify-content: center;
    align-items: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    width: 90%;
    max-width: 700px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 24px;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .modal-header h3 { font-size: 1.1rem; color: #fff; }
  .modal-close {
    background: none;
    border: none;
    color: #8b949e;
    font-size: 1.5rem;
    cursor: pointer;
    line-height: 1;
  }
  .modal-close:hover { color: #fff; }
  .detail-section { margin-bottom: 16px; }
  .detail-section h4 {
    font-size: 0.85rem;
    color: #8b949e;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .detail-section p, .detail-section pre {
    font-size: 0.85rem;
    color: #c9d1d9;
    line-height: 1.5;
  }
  .detail-section pre {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 200px;
    overflow-y: auto;
    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<h1>500 Error Bot <span class="conn-status"><span class="conn-dot" id="connDot"></span><span id="connText">연결 중...</span></span></h1>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('error')">에러 봇</button>
  <button class="tab-btn" onclick="switchTab('test')">테스트 실행</button>
</div>

<!-- 에러 봇 탭 -->
<div class="tab-panel active" id="tab-error">
  <h2>파이프라인</h2>
  <div class="pipeline" id="pipeline">
    <div class="step" data-step="received">
      <div class="step-name">에러 수신</div>
      <div class="step-status">대기</div>
    </div>
    <div class="arrow">→</div>
    <div class="step" data-step="parsing">
      <div class="step-name">파싱</div>
      <div class="step-status">대기</div>
    </div>
    <div class="arrow">→</div>
    <div class="step" data-step="fetching">
      <div class="step-name">코드 조회</div>
      <div class="step-status">대기</div>
    </div>
    <div class="arrow">→</div>
    <div class="step" data-step="analyzing">
      <div class="step-name">AI 분석</div>
      <div class="step-status">대기</div>
    </div>
    <div class="arrow">→</div>
    <div class="step" data-step="creating_pr">
      <div class="step-name">PR 생성</div>
      <div class="step-status">대기</div>
    </div>
  </div>

  <div class="middle">
    <div class="test-section">
      <button class="test-btn" id="testBtn" onclick="sendTest()">테스트 에러 전송</button>
    </div>
    <div class="history">
      <table>
        <thead><tr><th>시간</th><th>에러 타입</th><th>메시지</th><th>상태</th><th>PR</th></tr></thead>
        <tbody id="historyBody">
          <tr><td colspan="5" class="empty-msg">에러 기록이 없습니다</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <h2>실시간 로그</h2>
  <div class="log" id="logArea"></div>
</div>

<!-- 테스트 실행 탭 -->
<div class="tab-panel" id="tab-test">
  <div style="margin-bottom:16px;">
    <button class="test-btn" id="runTestsBtn" onclick="runTests()" style="background:#1f6feb;">테스트 코드 실행</button>
  </div>

  <div class="test-run-section" id="testRunSection">
    <div class="test-summary-bar" id="testSummaryBar">
      <span class="count total" id="testTotal">전체: -</span>
      <span class="count pass" id="testPass">통과: -</span>
      <span class="count fail" id="testFail">실패: -</span>
    </div>
    <div class="test-log" id="testLogArea"></div>
    <table class="test-results-table">
      <thead><tr><th>파일</th><th>테스트명</th><th>결과</th></tr></thead>
      <tbody id="testResultsBody"></tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">에러 상세</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const STEPS = ['received', 'parsing', 'fetching', 'analyzing', 'creating_pr'];
const STEP_LABELS = { received: '수신됨', parsing: '파싱 중', fetching: '조회 중', analyzing: '분석 중', creating_pr: '생성 중', done: '완료', failed: '실패' };

let currentErrorId = null;

// 플로우 시각화 업데이트
function updatePipeline(event) {
  const { error_id, step } = event;
  currentErrorId = error_id;

  document.querySelectorAll('.step').forEach(el => {
    el.classList.remove('active', 'done', 'failed');
    el.querySelector('.step-status').textContent = '대기';
  });

  if (step === 'failed') {
    // 마지막 활성 단계를 실패로 표시
    const allSteps = document.querySelectorAll('.step');
    allSteps.forEach(el => {
      el.classList.add('failed');
      el.querySelector('.step-status').textContent = '실패';
    });
    return;
  }

  const stepIndex = STEPS.indexOf(step === 'done' ? 'creating_pr' : step);

  STEPS.forEach((s, i) => {
    const el = document.querySelector(`.step[data-step="${s}"]`);
    if (i < stepIndex) {
      el.classList.add('done');
      el.querySelector('.step-status').textContent = '완료';
    } else if (i === stepIndex) {
      if (step === 'done') {
        el.classList.add('done');
        el.querySelector('.step-status').textContent = '완료';
      } else {
        el.classList.add('active');
        el.querySelector('.step-status').textContent = STEP_LABELS[s] || '진행 중';
      }
    }
  });
}

// 히스토리 테이블 업데이트
function renderHistory(errors) {
  const tbody = document.getElementById('historyBody');
  if (!errors.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-msg">에러 기록이 없습니다</td></tr>';
    return;
  }
  tbody.innerHTML = errors.map(e => {
    const time = new Date(e.timestamp).toLocaleString('ko-KR', { hour12: false });
    const badgeClass = e.step === 'done' ? 'done' : e.step === 'failed' ? 'failed' : 'active';
    const statusText = STEP_LABELS[e.step] || e.step;
    const d = e.data || {};
    const errorType = d.errorType || e.error_id || '-';
    const errorMsg = d.errorMessage ? (d.errorMessage.length > 40 ? d.errorMessage.slice(0, 40) + '...' : d.errorMessage) : '-';
    const link = d.pr_url
      ? `<a href="${d.pr_url}" target="_blank" onclick="event.stopPropagation()">PR 보기</a>`
      : '-';
    return `<tr data-eid="${e.error_id}" onclick="openModal('${e.error_id}')">
      <td>${time}</td>
      <td>${errorType}</td>
      <td>${errorMsg}</td>
      <td><span class="badge ${badgeClass}">${statusText}</span></td>
      <td>${link}</td>
    </tr>`;
  }).join('');
}

// 모달
function openModal(errorId) {
  fetch('/api/errors/' + errorId)
    .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
    .then(e => {
      const d = e.data || {};
      document.getElementById('modalTitle').textContent = d.errorType || e.error_id;
      let html = '';
      if (d.errorMessage) html += section('메시지', `<p>${esc(d.errorMessage)}</p>`);
      if (d.requestUrl) html += section('요청 URL', `<p>${esc(d.requestUrl)}</p>`);
      if (d.stackTrace) html += section('스택트레이스', `<pre>${esc(d.stackTrace)}</pre>`);
      if (d.root_cause) html += section('근본 원인', `<p>${esc(d.root_cause)}</p>`);
      if (d.analysis) html += section('AI 분석', `<p>${esc(d.analysis)}</p>`);
      if (d.fix_description) html += section('수정 내용', `<p>${esc(d.fix_description)}</p>`);
      if (d.pr_url) html += section('PR', `<p><a href="${d.pr_url}" target="_blank">${d.pr_url}</a></p>`);
      if (!html) html = '<p style="color:#8b949e;">상세 정보가 없습니다.</p>';
      document.getElementById('modalBody').innerHTML = html;
      document.getElementById('modalOverlay').classList.add('open');
    })
    .catch(() => {});
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

function section(title, content) {
  return `<div class="detail-section"><h4>${title}</h4>${content}</div>`;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// 로그 추가
const logArea = document.getElementById('logArea');
let logCount = 0;
function appendLog(event) {
  const ts = new Date(event.timestamp).toLocaleTimeString('ko-KR', { hour12: false });
  const div = document.createElement('div');
  div.className = `log-line step-${event.step}`;
  div.innerHTML = `<span class="ts">[${ts}]</span> <span class="msg">[${event.error_id}] ${event.message}</span>`;
  logArea.appendChild(div);
  logCount++;
  if (logCount > 200) {
    logArea.removeChild(logArea.firstChild);
    logCount--;
  }
  logArea.scrollTop = logArea.scrollHeight;
}

// SSE 연결
function connectSSE() {
  const es = new EventSource('/api/events');
  const dot = document.getElementById('connDot');
  const text = document.getElementById('connText');

  es.onopen = () => {
    dot.classList.add('connected');
    text.textContent = '연결됨';
  };
  es.onmessage = (e) => {
    const event = JSON.parse(e.data);
    updatePipeline(event);
    appendLog(event);
    // 히스토리 갱신
    fetch('/api/errors').then(r => r.json()).then(renderHistory);
  };
  es.onerror = () => {
    dot.classList.remove('connected');
    text.textContent = '재연결 중...';
  };
}

// 테스트 전송
async function sendTest() {
  const btn = document.getElementById('testBtn');
  btn.disabled = true;
  btn.textContent = '전송 중...';
  try {
    await fetch('/api/test-webhook', { method: 'POST' });
  } finally {
    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = '테스트 에러 전송';
    }, 3000);
  }
}

// 탭 전환
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`.tab-btn[onclick="switchTab('${name}')"]`).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

// 테스트 코드 실행
function runTests() {
  const btn = document.getElementById('runTestsBtn');
  btn.disabled = true;
  btn.textContent = '실행 중...';

  const section = document.getElementById('testRunSection');
  const logArea = document.getElementById('testLogArea');
  const tbody = document.getElementById('testResultsBody');
  logArea.innerHTML = '';
  tbody.innerHTML = '';
  document.getElementById('testTotal').textContent = '전체: -';
  document.getElementById('testPass').textContent = '통과: -';
  document.getElementById('testFail').textContent = '실패: -';

  const es = new EventSource('/api/tests/stream');
  es.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === 'log') {
      const div = document.createElement('div');
      div.textContent = ev.line;
      logArea.appendChild(div);
      logArea.scrollTop = logArea.scrollHeight;
    } else if (ev.type === 'result') {
      const cls = ev.status === 'passed' ? 'done' : 'failed';
      const label = ev.status === 'passed' ? 'PASS' : ev.status.toUpperCase();
      tbody.insertAdjacentHTML('beforeend',
        `<tr><td>${esc(ev.file)}</td><td>${esc(ev.name)}</td><td><span class="badge ${cls}">${label}</span></td></tr>`);
    } else if (ev.type === 'summary') {
      document.getElementById('testTotal').textContent = '전체: ' + ev.total;
      document.getElementById('testPass').textContent = '통과: ' + ev.passed;
      document.getElementById('testFail').textContent = '실패: ' + (ev.failed + ev.error);
      es.close();
      btn.disabled = false;
      btn.textContent = '테스트 코드 실행';
    } else if (ev.type === 'error') {
      logArea.insertAdjacentHTML('beforeend', `<div style="color:#f85149;">${esc(ev.message)}</div>`);
      es.close();
      btn.disabled = false;
      btn.textContent = '테스트 코드 실행';
    }
  };
  es.onerror = () => {
    es.close();
    btn.disabled = false;
    btn.textContent = '테스트 코드 실행';
  };
}

// 초기화
fetch('/api/errors').then(r => r.json()).then(renderHistory);
connectSSE();
</script>
</body>
</html>
